name: ci
run-name: ci

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/ci.yml@v2
    with:
      os-matrix: '["ubuntu-latest", "windows-latest"]'
      # Both legs execute the same count, so one flat floor covers them.
      min-tests: 143 # 150 executed - min(floor(150 * 0.05), 10) = 150 - 7
    permissions:
      contents: read
      checks: write
